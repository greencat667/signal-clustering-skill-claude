function drawChart() {
  W = Math.round(Math.min(800, Math.max(300, $("chart-wrap").clientWidth || 800)));

  const H = narrow ? Math.round(W * 1.0) : 480;
  const M = narrow ? { t: 14, r: 12, b: 46, l: 40 } : { t: 16, r: 24, b: 52, l: 56 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;

  svgEl("text", { class: "axis-title", x: M.l + iw / 2, y: H - 10, "text-anchor": "middle" }, svg).textContent = narrow ? "Momentum →" : "Momentum → evidence arriving faster";

    svgEl("text", { class: "quad-note", x: M.l + 6, y: M.t + 14 }, svg).textContent = "Early and surprising";

  card.append(scores);
  card.append(h("h3", {}, `Signals (${p.signals.length})`), h("ul", {}, ...p.signals.map(link)));
  card.append(h("h3", {}, "Counter-signals"));
  card.append(p.counter?.length ? h("ul", {}, ...p.counter.map((c) => { const li = link(c); if (c.why) li.append(` — ${c.why}`); return li; }))
    : h("p", { style: "margin:0;color:var(--ink-2)" }, p.counterNote || "None found. The log's sources may be one-sided on this."));
  if (p.next) card.append(h("h3", {}, "What to do"), h("p", { style: "margin:0" }, p.next));
  if (p.change) card.append(h("h3", {}, "What would change this"), h("p", { style: "margin:0" }, p.change));
  if (scroll) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* Table */
const table = $("table");
table.append(h("thead", {}, h("tr", {}, ...["", "Pattern", "Signals", "Mom.", "Spread", "Nov.", "Evid.", "Next step"].map((t) => h("th", {}, t)))));
const tb = h("tbody");
DATA.patterns.forEach((p) => {
  const sw = h("i", { class: "sw" }); sw.style.background = REC[p.recommendation].color;
  const tr = h("tr", { "data-id": p.id, tabindex: 0 },
    h("td", {}, p.id), h("td", {}, p.name, p.challenges?.length ? " ◌" : ""),
    ...["n", "momentum", "spread", "novelty", "evidence"].map((k) => h("td", { class: "num" }, k === "n" ? p.n : p.scores[k])),
    h("td", {}, h("span", { style: "display:inline-flex;gap:6px;align-items:center" }, sw, REC[p.recommendation].label)));
  tr.addEventListener("click", () => showCard(p.id, true));
  tr.addEventListener("keydown", (e) => { if (e.key === "Enter") showCard(p.id, true); });
  tb.append(tr);
});
table.append(tb);
table.append(h("caption", { style: "caption-side:bottom;text-align:left;color:var(--muted);font-size:12px;padding-top:8px" }, "◌ challenges an assumption. Select a row for its card."));

/* Assumptions and outliers */
const at = $("assumptions");
at.append(h("thead", {}, h("tr", {}, h("th", {}, "Assumption"), h("th", {}, "Status"), h("th", {}, "Patterns"))));
const atb = h("tbody");
const STATUS = { supported: "Supported", challenged: "Challenged", untested: "Untested" };
(DATA.assumptions || []).forEach((a) => atb.append(h("tr", {}, h("td", {}, a.text),
  h("td", { class: "status" }, (a.status === "challenged" ? "⚠ " : a.status === "supported" ? "✓ " : "? ") + STATUS[a.status]),
  h("td", {}, (a.patterns || []).join(", ") || "—"))));
at.append(atb);
$("outliers").append(...(DATA.outliers || []).map((o) => {
  const li = link(o); if (o.why) li.append(h("div", { style: "color:var(--ink-2);font-size:13px" }, o.why)); return li;
}));

showCard(DATA.patterns[0].id, false);
</script>
</body>
</html>
